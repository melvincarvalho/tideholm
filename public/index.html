<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tideholm</title>
  <meta name="description" content="Claim an island, raise it stone by stone, and hold it against the tide. A slow-burn multiplayer strategy game in the classic browser style — sign in with your Solid pod.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tideholm — island empire strategy">
  <meta property="og:description" content="Claim an island. Raise it stone by stone. The tide brings rivals. Free browser strategy in the classic early-2000s style — your pod identity is your captain.">
  <meta property="og:url" content="https://nostr.social/tideholm/">
  <meta property="og:image" content="https://nostr.social/tideholm/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tideholm — island empire strategy">
  <meta name="twitter:description" content="Claim an island. Raise it stone by stone. The tide brings rivals.">
  <meta name="twitter:image" content="https://nostr.social/tideholm/og-image.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Parchment is the default; apply before first paint so there is no
    // flash of the old look. 'retro' in localStorage opts back out.
    (function () {
      try {
        if (localStorage.getItem('ui-theme') !== 'retro') {
          document.documentElement.dataset.theme = 'parchment';
        }
      } catch (e) { /* storage blocked: default still applies via app.js */ }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme-parchment.css">
  <link rel="stylesheet" href="stage.css">
</head>
<body>
    <!-- Tab icon sprite (#102): stroke-only, currentColor — the ink follows
         the theme (parchment gold, retro dark, active highlight) with no
         hardcoded fills. The painted icon set is reserved for content
         surfaces; chrome stays quiet. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <g id="i-island"><path d="M4 19a8 4.5 0 0 1 16 0"/><path d="M11.5 15c0-3 .3-5 1.5-7"/><path d="M13 8c-2-2-4-2.5-6-1.5M13 8c2-2 4-2.5 6-1.5M13 8c-.5-2.5-2-4-4-4.5M13 8c1.5-2 3.5-2.5 5.5-2"/></g>
        <g id="i-islands"><path d="M2.5 10.5a4 2.5 0 0 1 8 0M13.5 8a3.5 2.2 0 0 1 7 0M7 19.5a4.5 2.6 0 0 1 9 0"/><path d="M6.5 8.5c0-1.5.2-2.5 1-3.5M17 6c0-1.2.2-2 .8-2.8"/></g>
        <g id="i-map"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/><path d="M17.2 8.2l2.6 2.6M19.8 8.2l-2.6 2.6"/></g>
        <g id="i-reports"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 12h5M9.5 15.5h5"/></g>
        <g id="i-rankings"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 5H5a3 3 0 0 0 3 4M16 5h3a3 3 0 0 1-3 4"/><path d="M12 12v4M8 20h8M10 20l.6-4h2.8l.6 4"/></g>
        <g id="i-market"><path d="M4 4h16l1.5 5h-19z"/><path d="M5 9v11h14V9"/><path d="M9 20v-5h6v5"/></g>
        <g id="i-alliance"><path d="M8.5 3.5l4.5 1.7V10c0 3.2-1.9 5.4-4.5 6.5C5.9 15.4 4 13.2 4 10V5.2z"/><path d="M15.5 7.5L20 9.2v4.3c0 3.2-1.9 5.4-4.5 6.5c-1.2-.5-2.2-1.2-3-2.1"/></g>
        <g id="i-mail"><path d="M3 6h18v12H3z"/><path d="M3 6l9 7 9-7"/></g>
      </defs>
    </svg>

  <!-- Login / register (same ids the client binds) -->
  <div id="auth" class="hidden">
    <div class="auth-box">
      <h1>Tideholm</h1>
      <p class="tagline" data-i18n="ui.auth.tagline"></p>
      <div id="auth-pregame" class="hidden"></div>
      <form id="auth-form">
        <input id="auth-name" data-i18n-ph="ui.auth.name.ph" autocomplete="username" maxlength="24" required>
        <input id="auth-pass" type="password" data-i18n-ph="ui.auth.pass.ph" autocomplete="current-password" required>
        <div class="auth-buttons">
          <button type="submit" data-mode="login" data-i18n="ui.auth.login"></button>
          <button type="submit" data-mode="register" data-i18n="ui.auth.register"></button>
        </div>
      </form>
      <p id="auth-error" class="error"></p>
      <p>
        <a href="almanac.html" id="auth-help" data-i18n="ui.auth.howto"></a>
        &nbsp;·&nbsp;
        <select id="auth-lang" class="lang-select"></select>
      </p>
    </div>
  </div>

  <!-- Game: identical ids to index.html, rearranged into the stage -->
  <div id="game" class="hidden">
    <header>
      <span class="brand">Tideholm</span>
      <nav>
        <button id="tab-island" class="tab active"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-island"/></svg><span class="tab-label" data-i18n="ui.tab.island"></span></button>
        <button id="tab-islands" class="tab"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-islands"/></svg><span class="tab-label" data-i18n="ui.tab.islands"></span></button>
        <button id="tab-map" class="tab"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-map"/></svg><span class="tab-label" data-i18n="ui.tab.map"></span></button>
        <button id="tab-reports" class="tab"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-reports"/></svg><span class="tab-label" data-i18n="ui.tab.reports"></span> <span id="report-badge" class="badge hidden"></span></button>
        <button id="tab-rankings" class="tab"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-rankings"/></svg><span class="tab-label" data-i18n="ui.tab.rankings"></span></button>
        <button id="tab-market" class="tab"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-market"/></svg><span class="tab-label" data-i18n="ui.tab.market"></span></button>
        <button id="tab-alliance" class="tab"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-alliance"/></svg><span class="tab-label" data-i18n="ui.tab.alliance"></span></button>
        <button id="tab-messages" class="tab"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-mail"/></svg><span class="tab-label" data-i18n="ui.tab.mail"></span> <span id="mail-badge" class="badge hidden"></span></button>
      </nav>
      <span class="spacer"></span>
      <select id="island-select" class="hidden"></select>
      <select id="game-lang" class="lang-select"></select>
      <button id="theme-toggle" class="small-btn" title="Theme">🎨</button>
      <span id="who"></span>
      <a href="almanac.html" target="_blank" class="help-link" id="game-help" data-i18n="ui.help"></a>
      <button id="logout" data-i18n="ui.logout"></button>
    </header>

    <div id="winner-banner" class="hidden"></div>
    <div id="pregame-banner" class="hidden"></div>

    <div id="resbar">
      <span class="res">🪵 <b id="res-wood">0</b> <small id="rate-wood"></small><span class="meter"><i id="bar-wood"></i></span></span>
      <span class="res">🪨 <b id="res-stone">0</b> <small id="rate-stone"></small><span class="meter"><i id="bar-stone"></i></span></span>
      <span class="res">🪙 <b id="res-gold">0</b> <small id="rate-gold"></small><span class="meter"><i id="bar-gold"></i></span></span>
      <span class="res">📦 <b id="res-cap">0</b> <small data-i18n="ui.capacity"></small></span>
      <span class="res" id="pop-chip">👥 <b id="pop-val">0</b><span class="meter"><i id="bar-pop"></i></span></span>
      <span class="res" id="loyal-chip">⚜️ <b id="loyal-val">0</b><span class="meter"><i id="bar-loyal"></i></span></span>
      <span class="res next-chip hidden" id="next-chip" title="">⏳ <b id="next-chip-text"></b></span>
    </div>

    <div class="stage-grid">

      <!-- =================== left rail (stage-only, decorative) ============ -->
      <aside class="stage-rail" id="stage-left">
        <div class="stage-panel">
          <div class="stage-hero">
            <div class="stage-face">⚔️</div>
            <div class="stage-who"><b id="stage-name">—</b><span id="stage-rank"></span></div>
          </div>
          <div class="stage-stat" id="stage-points">🏆 —</div>
          <div class="stage-stat" id="stage-islands">🏝️ —</div>
          <div class="stage-stat" id="stage-loyalty">⚜️ —</div>
          <div class="stage-stat" id="stage-pop">👥 —</div>
        </div>
        <div class="stage-panel" id="stage-quest-panel">
          <h3>📜</h3>
          <div class="stage-kv" id="stage-quest">—</div>
        </div>
        <div class="stage-banner">🏝️</div>
      </aside>

      <!-- =================== center: the real client ====================== -->
      <main>
        <section id="view-island">
          <h2 id="island-title"></h2>
          <p><button id="rename-btn" class="small-btn" data-i18n="ui.rename"></button></p>
          <div id="quest-box" class="hidden"></div>

          <div id="movements"></div>

          <h3 data-i18n="ui.queue"></h3>
          <table id="queue"><tbody></tbody></table>

          <h3 data-i18n="ui.buildings"></h3>
          <table id="buildings">
            <thead>
              <tr>
                <th data-i18n="ui.th.building"></th><th data-i18n="ui.th.level"></th>
                <th data-i18n="ui.th.cost"></th><th data-i18n="ui.th.time"></th><th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <p id="build-error" class="error"></p>

          <h3 data-i18n="ui.troops"></h3>
          <table id="units">
            <thead>
              <tr>
                <th data-i18n="ui.th.unit"></th><th data-i18n="ui.th.have"></th>
                <th data-i18n="ui.th.atk"></th><th data-i18n="ui.th.def"></th>
                <th data-i18n="ui.th.carry"></th><th data-i18n="ui.th.costEach"></th>
                <th data-i18n="ui.th.train"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <table id="train-queue"><tbody></tbody></table>
          <p id="train-error" class="error"></p>

          <div id="support-here-box" class="hidden">
            <h3 data-i18n="ui.support.here"></h3>
            <div id="support-here"></div>
          </div>
          <div id="abroad-box" class="hidden">
            <h3 data-i18n="ui.support.abroad"></h3>
            <div id="abroad-list"></div>
          </div>
        </section>

        <section id="view-islands" class="hidden">
          <h2 data-i18n="ui.tab.islands"></h2>
          <p class="hint" data-i18n="ui.islands.hint"></p>
          <table id="islands-table">
            <thead>
              <tr>
                <th data-i18n="ui.th.island"></th>
                <th><span aria-hidden="true">🪵</span><span class="sr-only" data-i18n="res.wood"></span></th>
                <th><span aria-hidden="true">🪨</span><span class="sr-only" data-i18n="res.stone"></span></th>
                <th><span aria-hidden="true">🪙</span><span class="sr-only" data-i18n="res.gold"></span></th>
                <th data-i18n="ui.pop"></th>
                <th data-i18n="ui.th.def"></th>
                <th data-i18n="building.wall.name"></th>
                <th data-i18n="ui.merchants"></th>
                <th data-i18n="ui.th.points"></th>
              </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
              <tr>
                <th data-i18n="ui.islands.total"></th>
                <td id="isl-t-wood"></td><td id="isl-t-stone"></td><td id="isl-t-gold"></td>
                <td id="isl-t-pop"></td>
                <!-- defence and wall do not sum: an attacker meets one island's
                     defence, never the fleet's - a grand total here would be the
                     misreading this table exists to prevent -->
                <td>&mdash;</td><td>&mdash;</td>
                <td id="isl-t-merch"></td>
                <td id="isl-t-points"></td>
              </tr>
              <tr class="production">
                <th data-i18n="ui.stage.prod"></th>
                <td id="isl-p-wood"></td><td id="isl-p-stone"></td><td id="isl-p-gold"></td>
                <td></td><td></td><td></td><td></td><td></td>
              </tr>
              <tr class="production atsea">
                <th data-i18n="ui.stage.atsea"></th>
                <td id="isl-s-wood"></td><td id="isl-s-stone"></td><td id="isl-s-gold"></td>
                <td></td><td></td><td></td><td></td><td></td>
              </tr>
            </tfoot>
          </table>

          <h3 data-i18n="ui.islands.army"></h3>
          <p class="hint" data-i18n="ui.islands.armyHint"></p>
          <div class="tbl-scroll">
          <table id="army-table">
            <thead><tr id="army-head"></tr></thead>
            <tbody></tbody>
            <tfoot><tr id="army-total"></tr></tfoot>
          </table>
          </div>

          <h3 data-i18n="ui.islands.moves"></h3>
          <p class="hint" data-i18n="ui.islands.movesHint"></p>
          <table id="fleet-moves">
            <thead><tr>
              <th data-i18n="ui.islands.movWhat"></th>
              <th data-i18n="ui.islands.movFrom"></th>
              <th data-i18n="ui.islands.movCargo"></th>
              <th data-i18n="ui.islands.movEta"></th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </section>

        <section id="view-map" class="hidden">
          <h2 data-i18n="ui.map.title"></h2>
          <p class="hint" data-i18n="ui.map.hint"></p>
          <div class="map-tools">
            <canvas id="minimap" width="160" height="160"></canvas>
            <span class="zoom-btns">
              <button id="zoom-out" class="small-btn">−</button>
              <button id="zoom-in" class="small-btn">+</button>
            </span>
          </div>
          <div id="map-grid"></div>
          <div id="attack-panel" class="hidden">
            <h3 id="attack-title"></h3>
            <div id="attack-form">
              <div id="attack-units"></div>
              <p class="hint"><span data-i18n="ui.attack.travel"></span> <b id="attack-eta">—</b> <span data-i18n="ui.attack.travelNote"></span></p>
              <p class="hint" id="flagship-hint" data-i18n="ui.attack.flagshipHint"></p>
              <button id="attack-send" data-i18n="ui.attack.send"></button>
              <button id="support-send" data-i18n="ui.support.send"></button>
              <span id="scout-box" class="scout-box">
                <input type="number" id="scout-n" min="1" max="500" value="1">
                <button id="scout-send" data-i18n="ui.scout.send"></button>
              </span>

              <div id="sim-box">
                <h4 data-i18n="ui.sim.title"></h4>
                <div id="sim-units" class="sim-row"></div>
                <label class="sim-row"><span data-i18n="ui.sim.wall"></span>
                  <input type="number" id="sim-wall" min="0" max="30" value="0"></label>
                <p id="sim-result" class="hint"></p>
              </div>
            </div>

            <div id="trade-form" class="hidden">
              <h4 data-i18n="ui.trade.title"></h4>
              <div class="sim-row">
                🪵 <input type="number" id="trade-wood" min="0" value="0"
                  ><button class="res-max" data-res="wood" title="fill with wood, clear the rest">▲</button>
                🪨 <input type="number" id="trade-stone" min="0" value="0"
                  ><button class="res-max" data-res="stone" title="fill with stone, clear the rest">▲</button>
                🪙 <input type="number" id="trade-gold" min="0" value="0"
                  ><button class="res-max" data-res="gold" title="fill with gold, clear the rest">▲</button>
              </div>
              <p class="hint" id="trade-cap"></p>
              <button id="trade-send" data-i18n="ui.trade.send"></button>
            </div>
            <div id="colonize-form" class="hidden">
              <p class="hint" id="colonize-hint"></p>
              <button id="colonize-send" data-i18n="ui.colonize.send"></button>
            </div>
            <p id="attack-error" class="error"></p>
          </div>
        </section>

        <section id="view-reports" class="hidden">
          <h2 data-i18n="ui.reports.title"></h2>
          <div id="report-list"></div>
        </section>

        <section id="view-rankings" class="hidden">
          <h2 data-i18n="ui.rankings.title"></h2>
          <div id="wonders-box" class="hidden">
            <h3 data-i18n="ui.wonder.title"></h3>
            <div id="wonders-list"></div>
          </div>
          <div id="hof-box" class="hidden">
            <h3 data-i18n="ui.hof.title"></h3>
            <div id="hof-list"></div>
          </div>
          <table id="ranking-table">
            <thead>
              <tr>
                <th>#</th><th data-i18n="ui.th.player"></th><th data-i18n="ui.th.alliance"></th>
                <th data-i18n="ui.th.islands"></th><th data-i18n="ui.th.points"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section id="view-market" class="hidden">
          <h2 data-i18n="ui.tab.market"></h2>

          <div id="vault-box">
            <h3 data-i18n="ui.vault.title"></h3>
            <p class="hint" data-i18n="ui.vault.hint"></p>
            <p id="vault-balance"></p>
            <div class="sim-row">
              <input type="number" id="vault-amount" min="1" step="1" value="100">
              <button id="vault-deposit" data-i18n="ui.vault.deposit"></button>
              <button id="vault-withdraw" data-i18n="ui.vault.withdraw"></button>
            </div>
            <p class="hint error" id="vault-msg"></p>
          </div>

          <div id="tidegate-box">
            <h3 data-i18n="ui.tidegate.title"></h3>
            <p class="hint" data-i18n="ui.tidegate.hint"></p>
            <p id="tidegate-balance"></p>
            <div class="sim-row">
              <input type="number" id="tidegate-amount" min="1" step="1" value="100">
              <button id="tidegate-pegin" data-i18n="ui.tidegate.pegin"></button>
              <button id="tidegate-pegout" data-i18n="ui.tidegate.pegout"></button>
            </div>
            <p class="hint error" id="tidegate-msg"></p>
          </div>

          <div id="pool-box" class="hidden">
            <h3 data-i18n="ui.pool.title"></h3>
            <p id="pool-shut" class="hint hidden" data-i18n="ui.pool.shut"></p>
            <div id="pool-live" class="hidden">
              <table id="pool-reserves"><tbody></tbody></table>
              <p class="hint" id="pool-prices"></p>
              <p class="hint" id="pool-mine"></p>
              <div class="sim-row">
                <span data-i18n="ui.pool.give"></span>
                <select id="pool-from"></select>
                <input type="number" id="pool-amount" min="1" step="1" value="100">
                <span data-i18n="ui.pool.get"></span>
                <select id="pool-to"></select>
                <button id="pool-swap" data-i18n="ui.pool.swap"></button>
              </div>
              <p class="hint" id="pool-quote"></p>
              <p class="hint" id="pool-sent"></p>
              <div class="sim-row">
                <span data-i18n="ui.pool.provide"></span>
                <input type="number" id="lp-wood" min="1" step="1" value="500">
                <span data-i18n="res.wood"></span>
                <button id="lp-deposit" data-i18n="ui.pool.deposit"></button>
                <button id="lp-withdraw" data-i18n="ui.pool.withdrawAll"></button>
              </div>
              <p class="hint" id="lp-preview"></p>
            </div>
          </div>

          <h3 data-i18n="ui.market.create"></h3>
          <div class="sim-row">
            <span data-i18n="ui.market.give"></span>
            <select id="offer-give-res"></select>
            <input type="number" id="offer-give-n" min="1" max="1000" value="100">
            <span data-i18n="ui.market.want"></span>
            <select id="offer-want-res"></select>
            <input type="number" id="offer-want-n" min="1" max="1000" value="100">
            <button id="offer-post" data-i18n="ui.market.post"></button>
          </div>
          <p id="market-error" class="error"></p>
          <div id="offers-mine-box" class="hidden">
            <h3 data-i18n="ui.market.mine"></h3>
            <div id="offers-mine"></div>
          </div>
          <h3 data-i18n="ui.market.open"></h3>
          <div id="offers-open"></div>
        </section>

        <section id="view-alliance" class="hidden">
          <h2 data-i18n="ui.alliance.title"></h2>
          <div id="alliance-none" class="hidden">
            <h3 data-i18n="ui.alliance.found"></h3>
            <form id="alliance-create">
              <input id="alliance-name" data-i18n-ph="ui.alliance.name.ph" maxlength="30" required>
              <input id="alliance-tag" placeholder="TAG" maxlength="5" required>
              <button type="submit" data-i18n="ui.alliance.foundBtn"></button>
            </form>
            <h3 data-i18n="ui.alliance.invites"></h3>
            <div id="alliance-invites"></div>
          </div>
          <div id="alliance-mine" class="hidden">
            <h3 id="alliance-title"></h3>
            <table id="alliance-members">
              <thead>
                <tr>
                  <th data-i18n="ui.th.member"></th><th data-i18n="ui.th.islands"></th>
                  <th data-i18n="ui.th.points"></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
            <h3 data-i18n="ui.alliance.invite"></h3>
            <form id="alliance-invite">
              <input id="alliance-invite-name" data-i18n-ph="ui.alliance.player.ph" maxlength="24" required>
              <button type="submit" data-i18n="ui.alliance.inviteBtn"></button>
            </form>

            <h3 data-i18n="ui.board.title"></h3>
            <form id="board-form">
              <input id="board-body" data-i18n-ph="ui.board.ph" maxlength="500" required>
              <button type="submit" data-i18n="ui.board.post"></button>
            </form>
            <div id="board-list"></div>

            <h3 data-i18n="ui.dip.title"></h3>
            <p class="hint" id="dip-note"></p>
            <div id="dip-list"></div>

            <p><button id="alliance-leave" data-i18n="ui.alliance.leave"></button></p>
          </div>
          <p id="alliance-error" class="error"></p>
        </section>

        <section id="view-messages" class="hidden">
          <h2 data-i18n="ui.mail.title"></h2>
          <!-- Identity + standing. Filled by renderProfile() from /api/rankings,
               which already carries isYou and webId — no server change needed. -->
          <div id="profile-box"></div>
          <form id="mail-compose">
            <input id="mail-to" data-i18n-ph="ui.mail.to.ph" maxlength="24" required>
            <input id="mail-body" data-i18n-ph="ui.mail.body.ph" maxlength="500" required>
            <button type="submit" data-i18n="ui.mail.send"></button>
          </form>
          <p id="mail-error" class="error"></p>
          <div id="mail-list"></div>
        </section>
      </main>

      <!-- =================== right rail (stage-only, read-only) =========== -->
      <aside class="stage-rail" id="stage-right">
        <div class="stage-panel">
          <h3 id="stage-map-title" data-i18n="ui.stage.map"></h3>
          <canvas id="stage-map" width="180" height="180"></canvas>
        </div>
        <div class="stage-panel">
          <h3 id="stage-info-title" data-i18n="ui.stage.info"></h3>
          <div class="stage-kv" id="stage-info">—</div>
        </div>
        <div class="stage-panel">
          <h3 id="stage-prod-title" data-i18n="ui.stage.prod"></h3>
          <div class="stage-kv" id="stage-prod">—</div>
        </div>
        <div class="stage-panel">
          <h3 id="stage-queue-title" data-i18n="ui.stage.queue"></h3>
          <div class="stage-kv" id="stage-queue">—</div>
        </div>
      </aside>

    </div>
  </div>

  <script type="module" src="i18n.js"></script>
  <script type="module" src="map.js"></script>
  <script type="module" src="app.js"></script>
  <script defer src="islands-dock.js"></script>
  <script defer src="hotkeys.js"></script>
  <script defer src="stage.js"></script>
  <!-- UI sound: synthesized button tick. Remove this line to silence. -->
  <script defer src="sound.js"></script>
</body>
</html>
